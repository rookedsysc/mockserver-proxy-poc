services:
  upstream:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./upstream:/app:ro
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  mockserver:
    image: mockserver/mockserver:7.5.0
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      MOCKSERVER_LOG_LEVEL: INFO
      MOCKSERVER_INITIALIZATION_OPENAPI_PATH: /config/openapi.yaml
      MOCKSERVER_PROXY_REMOTE_HOST: upstream
      MOCKSERVER_PROXY_REMOTE_PORT: "8080"
    volumes:
      - ./openapi.yaml:/config/openapi.yaml:ro
    depends_on:
      upstream:
        condition: service_healthy

  verifier:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "smoke.mjs"]
    environment:
      MOCKSERVER_BASE_URL: http://mockserver:1080
    volumes:
      - ./tests:/app:ro
    depends_on:
      mockserver:
        condition: service_healthy
      upstream:
        condition: service_healthy
