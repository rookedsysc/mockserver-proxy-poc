services:
  nestjs:
    build:
      context: ./nestjs
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  mockoon-sync:
    build:
      context: ./mockoon
    environment:
      OPENAPI_URL: http://nestjs:3000/docs-json
      MOCKOON_DATA_FILE: /data/environment.json
      MOCKOON_PORT: "1080"
      UPSTREAM_URL: http://nestjs:3000
    volumes:
      - ./mockoon:/data
    depends_on:
      nestjs:
        condition: service_healthy

  mockoon:
    image: mockoon/cli:9.7.0
    command:
      [
        "--data",
        "/data/environment.json",
        "--port",
        "1080",
        "--hostname",
        "0.0.0.0",
        "--proxy",
        "enabled",
        "--watch",
        "--disable-log-to-file",
      ]
    ports:
      - "127.0.0.1:1080:1080"
    volumes:
      - ./mockoon:/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:1080/api/users/42').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      mockoon-sync:
        condition: service_completed_successfully

  verifier:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "smoke.mjs"]
    environment:
      MOCKOON_BASE_URL: http://mockoon:1080
      NESTJS_BASE_URL: http://nestjs:3000
    volumes:
      - ./tests:/app:ro
      - ./mockoon:/mockoon:ro
    depends_on:
      mockoon:
        condition: service_healthy
      nestjs:
        condition: service_healthy
